name: Render carte Babacar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Installer le rendu SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Générer le PNG 1080x1920
        run: |
          rsvg-convert -w 1080 -h 1920 carte-babacar-plombier-pro-9x16-adherent.svg -o carte-babacar-plombier-pro-9x16.png
      - name: Publier uniquement la carte PNG
        run: |
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add carte-babacar-plombier-pro-9x16.png
          if git diff --cached --quiet; then
            echo "Aucun changement PNG"
            exit 0
          fi
          git commit -m "Carte Babacar : corriger la mise en page adhérent"
          git push
