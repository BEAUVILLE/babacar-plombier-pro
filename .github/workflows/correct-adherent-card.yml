name: Corriger carte Babacar adhérent

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  correct-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Corriger la carte et le wording
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          path=Path('carte-babacar-plombier-pro-9x16.png')
          im=Image.open(path).convert('RGB')
          W,H=im.size
          sx,sy=W/1080,H/1920
          s=min(sx,sy)
          d=ImageDraw.Draw(im)
          cream=(255,249,235); boxc=(235,244,238); green=(16,113,76); dark=(4,32,23); light=(255,238,194)
          fontp='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def R(x1,y1,x2,y2): return (round(x1*sx),round(y1*sy),round(x2*sx),round(y2*sy))
          def F(n): return ImageFont.truetype(fontp,max(10,round(n*s)))
          def ct(text,r,font,fill):
              x1,y1,x2,y2=r; bb=d.textbbox((0,0),text,font=font); tw,th=bb[2]-bb[0],bb[3]-bb[1]
              d.text(((x1+x2-tw)/2,(y1+y2-th)/2-round(3*s)),text,font=font,fill=fill)

          d.rectangle(R(70,995,1010,1135),fill=cream)
          left,right=R(93,1008,511,1117),R(531,1008,951,1117)
          for rect in (left,right): d.rounded_rectangle(rect,radius=round(22*s),fill=boxc,outline=(173,205,190),width=max(1,round(2*s)))
          ct('WC • DOUCHE',left,F(29),green)
          ct('TUYAUTERIE',right,F(29),green)
          d.rectangle(R(205,1118,875,1185),fill=(255,255,255))
          txt='SCANNEZ POUR CONTACTER BABACAR'; f=F(31); bb=d.textbbox((0,0),txt,font=f)
          d.text(((W-(bb[2]-bb[0]))/2,round(1130*sy)),txt,font=f,fill=dark)
          d.rectangle(R(0,1780,1080,1920),fill=dark)
          line='CONTACT DIRECT • PAIEMENT DIRECT • 0 % COMMISSION DIGIY'; f=F(19); bb=d.textbbox((0,0),line,font=f)
          d.text(((W-(bb[2]-bb[0]))/2,round(1798*sy)),line,font=f,fill=light)
          brand='DIGIYLYFE.COM'; f=F(54); bb=d.textbbox((0,0),brand,font=f)
          d.text(((W-(bb[2]-bb[0]))/2,round(1840*sy)),brand,font=f,fill=light)
          im.save(path,optimize=True)

          idx=Path('index.html')
          text=idx.read_text(encoding='utf-8')
          repl={
            'Fiche artisan officielle':'Adhérent DIGIYLYFE',
            '✅ Fiche officielle':'✅ Adhérent DIGIYLYFE',
            'votre fiche officielle DIGIYLYFE':'votre fiche DIGIYLYFE',
            'Official artisan profile':'DIGIYLYFE member',
            '✅ Official profile':'✅ DIGIYLYFE member',
            'your official DIGIYLYFE profile':'your DIGIYLYFE profile',
            'Ficha oficial de artesano':'Adherente DIGIYLYFE',
            '✅ Ficha oficial':'✅ Adherente DIGIYLYFE',
            'su ficha oficial DIGIYLYFE':'su ficha DIGIYLYFE'
          }
          for a,b in repl.items(): text=text.replace(a,b)
          idx.write_text(text,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add carte-babacar-plombier-pro-9x16.png index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Carte Babacar : adhérent DIGIYLYFE"
          git push
