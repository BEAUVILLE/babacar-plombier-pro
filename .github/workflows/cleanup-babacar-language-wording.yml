name: Nettoyer wording Babacar langues
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-babacar-language-wording.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retirer les deux restes de statut officiel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Ihr offizielles DIGIYLYFE-Profil','Ihr DIGIYLYFE-Profil')
          s=s.replace('ملفك الرسمي على DIGIYLYFE','ملفك على DIGIYLYFE')
          p.write_text(s,encoding='utf-8')
          PY
          grep -inoE 'officiel|officielle|offiziell|الرسمي|vérifi|certifi|garanti|ambassadeur|sélectionné' index.html | head -40 || true
      - name: Commit index seulement
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Babacar : neutraliser le wording officiel restant' || exit 0
          git push
