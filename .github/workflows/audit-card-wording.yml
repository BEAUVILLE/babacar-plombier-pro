name: Corriger carte Babacar adhérent
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-card-wording.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Poser ADHÉRENT DIGIYLYFE sur la carte
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          p=Path('carte-babacar-plombier-pro-9x16.png')
          im=Image.open(p).convert('RGBA')
          w,h=im.size
          overlay=Image.new('RGBA', im.size, (0,0,0,0))
          d=ImageDraw.Draw(overlay)

          x1,x2=int(w*0.245),int(w*0.755)
          y1,y2=170,238
          d.rounded_rectangle((x1,y1,x2,y2), radius=30, fill=(3,24,18,236), outline=(244,201,93,255), width=3)

          font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          size=34
          font=ImageFont.truetype(font_path,size)
          text='ADHÉRENT DIGIYLYFE'
          while d.textbbox((0,0),text,font=font)[2] > (x2-x1-42) and size>22:
              size-=1
              font=ImageFont.truetype(font_path,size)
          box=d.textbbox((0,0),text,font=font)
          tw,th=box[2]-box[0],box[3]-box[1]
          tx=x1+(x2-x1-tw)/2
          ty=y1+(y2-y1-th)/2-box[1]-1
          d.text((tx,ty),text,font=font,fill=(255,232,168,255),stroke_width=1,stroke_fill=(0,0,0,180))

          out=Image.alpha_composite(im,overlay)
          out.save(p,'PNG',optimize=True)
          print('Carte corrigée:',p,'size=',out.size)
          PY
      - name: Commit carte uniquement
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add carte-babacar-plombier-pro-9x16.png
          git commit -m 'Carte Babacar : ajouter ADHÉRENT DIGIYLYFE'
          git push
